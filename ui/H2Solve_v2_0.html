<style>
  :root {
    --bg: #121317;
    --surface: #1b1d23;
    --surface-raised: #21242b;
    --border: #2d3038;
    --text-primary: #eceef1;
    --text-secondary: #9298a4;
    --text-faint: #656b76;

    --gold: #d8b45c;
    --gold-soft: rgba(216, 180, 92, 0.14);
    --green: #3ecf7e;
    --red: #e2687f;

    --accent: var(--gold);
    --accent-hover: #e6c476;

    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(216,180,92,0.06), transparent 45%),
                       radial-gradient(circle at 85% 20%, rgba(62,207,126,0.05), transparent 45%);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1140px;
    margin: 0 auto;
    padding: 24px 24px 28px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }

  .logo-img {
    height: 54px;
    width: auto;
    display: block;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0 18px;
  }

  /* ---------- Layout ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 840px) {
    .grid { grid-template-columns: 1fr; }
  }

  .column {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 16px 18px;
  }

  .card-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-label span.title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
  }

  /* ---------- Options card ---------- */
  .field-hint {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin: 0 0 10px;
    line-height: 1.5;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
    border: 1.5px solid var(--chip-color, var(--border));
    color: var(--chip-color, var(--text-secondary));
    transition: background 0.15s ease, color 0.15s ease;
  }

  .chip .swatch-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--chip-color);
    flex-shrink: 0;
  }

  .chip.selected {
    background: var(--chip-color);
    color: #14161a;
  }

  .chip.selected .swatch-dot { background: #14161a; }

  .mix-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .mix-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--mix-color, var(--surface-raised));
    flex-shrink: 0;
  }

  .mix-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .mix-label strong { color: var(--text-primary); font-weight: 600; }

  .auto-detect-btn {
    padding: 5px 12px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-primary);
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease;
  }

  .auto-detect-btn:hover { border-color: var(--gold); }

  /* ---------- Result cards ---------- */
  .results-row {
    display: flex;
    gap: 16px;
  }

  .result-card { flex: 1; display: flex; flex-direction: column; }

  .result-card.rag {
    border-left: 3px solid var(--mix-color, var(--border));
  }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .result-badge.default {
    background: var(--surface-raised);
    color: var(--text-secondary);
  }

  .result-badge.rag {
    background: var(--gold-soft);
    color: var(--gold);
  }

  .result-body {
    margin: 10px 0 0;
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 210px;
  }

  .result-body.empty {
    color: var(--text-faint);
    font-family: 'Inter', system-ui, sans-serif;
    font-style: italic;
  }

  /* ---------- Prompt card ---------- */
  .prompt-card { display: flex; flex-direction: column; }

  .prompt-textarea {
    width: 100%;
    min-height: 190px;
    border: none;
    outline: none;
    resize: vertical;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-primary);
    background: transparent;
  }

  .prompt-textarea::placeholder { color: var(--text-faint); }

  .calculate-btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #16171b;
    background: linear-gradient(135deg, var(--gold), #c9a24a);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .calculate-btn:hover { filter: brightness(1.08); }
  .calculate-btn:active { transform: translateY(1px); }
  .calculate-btn:disabled { opacity: 0.6; cursor: wait; filter: none; transform: none; }

  /* ---------- Model status footer ---------- */
  .model-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 0.83rem;
    color: var(--text-secondary);
  }

  .model-status .status-light {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
  }

  .model-status .status-light.linked { background: var(--green); }
  .model-status .status-light.not-linked { background: var(--red); }

  .model-status strong { color: var(--text-primary); font-weight: 600; }
</style>
</head>

    res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch {
    throw new Error(`Can't reach the connector at ${API_BASE}. Is connector.py running?`);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
    throw new Error(`Connector error ${res.status}: ${detail || res.statusText}`);
  }
  return data;
}

const CATEGORIES = [
  {
    id: 'calculus',
    label: 'Calculus',
    color: '#e2687f',
    keywords: [
      'derivative', 'integral', 'integrate', 'differentiate', 'limit',
      'd/dx', 'antiderivative', 'tangent line', 'rate of change', 'series',
    ],
  },
  {
    id: 'linear-algebra',
    label: 'Linear Algebra',
    color: '#d8b45c',
    keywords: [
      'matrix', 'matrices', 'vector', 'eigenvalue', 'eigenvector',
      'determinant', 'linear system', 'dot product', 'cross product',
      'span', 'basis', 'null space', 'rank',
    ],
  },
  {
    id: 'algebra',
    label: 'Algebra',
    color: '#5aa9e6',
    keywords: [
      'solve for x', 'quadratic', 'polynomial', 'factor', 'equation',
      'inequality', 'exponent', 'logarithm', 'simplify', 'expand',
    ],
  },
  {
    id: 'geometry-trig',
    label: 'Geometry & Trig',
    color: '#3ecf7e',
    keywords: [
      'triangle', 'angle', 'sine', 'cosine', 'tangent', 'circle',
      'area of', 'perimeter', 'volume of', 'pythagorean', 'radius', 'hypotenuse',
    ],
  },
  {
    id: 'statistics',
    label: 'Statistics & Probability',
    color: '#a78bfa',
    keywords: [
      'probability', 'mean', 'median', 'mode', 'standard deviation',
      'variance', 'distribution', 'random variable', 'expected value',
      'confidence interval', 'regression',
    ],
  },
  {
    id: 'other',
    label: 'Other',
    color: '#c3c7ce',
    keywords: [],
  },
];

const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));

function detectCategories(promptText) {
  const text = promptText.toLowerCase();
  const matches = CATEGORIES.filter(
    (c) => c.keywords.length > 0 && c.keywords.some((kw) => text.includes(kw))
  ).map((c) => c.id);
  return matches.length > 0 ? matches : ['other'];
}

// Plain RGB average: not perceptually accurate, but fine for an accent color.
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function blendColors(hexColors) {
  if (hexColors.length === 0) return null;
  const sum = hexColors.reduce(
    (acc, hex) => {
      const { r, g, b } = hexToRgb(hex);
      return { r: acc.r + r, g: acc.g + g, b: acc.b + b };
    },
    { r: 0, g: 0, b: 0 }
  );
  const n = hexColors.length;
  const toHex = (v) => Math.round(v / n).toString(16).padStart(2, '0');
  return `#${toHex(sum.r)}${toHex(sum.g)}${toHex(sum.b)}`;
}

function App() {
  const [prompt, setPrompt] = useState('');
  const [selected, setSelected] = useState([]); // array of category ids
  const [wasAutoDetected, setWasAutoDetected] = useState(false);
  const [defaultResult, setDefaultResult] = useState('');
  const [ragResult, setRagResult] = useState('');
  const [loading, setLoading] = useState(false);

  // 'checking' until the status request settles, then the model name, or null if unreachable.
  const [modelName, setModelName] = useState('checking');

  useEffect(() => {
    const controller = new AbortController();
    // Generous because the connector's check calls Ollama, which can be slow to answer.
    const timeout = setTimeout(() => controller.abort(), 15000);

    fetch(API_BASE + '/api/model', { signal: controller.signal })
      .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
      .then((data) => setModelName(data.model || null))
      // Don't overwrite a status already set by a successful Calculate.
      .catch(() => setModelName((prev) => (prev === 'checking' ? null : prev)))
      .finally(() => clearTimeout(timeout));

    return () => controller.abort();
  }, []);

  const modelLabel = modelName === 'checking' ? 'Checking…' : modelName || 'Not linked';

  const mixColor = useMemo(
    () => blendColors(selected.map((id) => CATEGORY_MAP[id].color)),
    [selected]
  );

  function toggleCategory(id) {
    setSelected((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
    setWasAutoDetected(false);
  }

  function handleAutoDetect() {
    setSelected(detectCategories(prompt));
    setWasAutoDetected(true);
  }

  async function handleCalculate() {
    const trimmedPrompt = prompt.trim();

    if (!trimmedPrompt) {
      setDefaultResult('Enter a problem above, then press Calculate.');
      setRagResult('Enter a problem above, then press Calculate.');
      return;
    }

    const categoryLabel = selected.length
      ? selected.map((id) => CATEGORY_MAP[id].label).join(' + ')
      : 'not selected';

    // No timeout: gemma3:4b can take a minute or more on a CPU.
    setLoading(true);
    setDefaultResult('Working… (the base model can take a minute)');
    const basePromise = postJSON('/api/base', { question: trimmedPrompt, categories: selected })
      .then((data) => {
        setModelName(data.model || BASE_MODEL);
        setDefaultResult(
          data.answer +
          `\n\n— ${data.latency_s}s` +
          (data.truncated ? ' (answer was cut off at the length limit)' : '')
        );
      })
      .catch((err) => setDefaultResult(`Error: ${err.message}`));

    // TODO: call POST /api/rag once the connector has it.
    setRagResult(
      `User wished to solve problem: "${trimmedPrompt}"\n` +
      `using these selections: category = ${categoryLabel}` +
      `${wasAutoDetected ? ' (auto-detected)' : ''}, model = ${modelLabel}\n\n` +
      `[Placeholder — RAG is not connected yet. Once it is, this box ` +
      `will show the answer generated using retrieved textbook context.]`
    );

    await basePromise;
    setLoading(false);
  }

  return (
    <div className="page">
      <header className="header">
        <img className="logo-img" src={LOGO_SRC} alt="H2 Solve" />
      </header>

      <div className="divider" />

      <div className="grid">
        <div className="column">
          <div className="card">
            <div className="card-label">
              <span className="title">Problem Type</span>
              <button type="button" className="auto-detect-btn" onClick={handleAutoDetect}>
                Auto Detect
              </button>
            </div>
            <p className="field-hint">
              Pick one or more types to help the RAG model retrieve the right textbook material.
            </p>

            <div className="chip-row">
              {CATEGORIES.map((c) => (
                <button
                  key={c.id}
                  type="button"
                  className={`chip ${selected.includes(c.id) ? 'selected' : ''}`}
                  style={{ '--chip-color': c.color }}
                  onClick={() => toggleCategory(c.id)}
                >
                  <span className="swatch-dot" />
                  {c.label}
                </button>
              ))}
            </div>

            <div className="mix-row">
              <div className="mix-swatch" style={{ '--mix-color': mixColor }} />
              <span className="mix-label">
                {selected.length === 0 && 'No type selected yet'}
                {selected.length === 1 && (
                  <><strong>{CATEGORY_MAP[selected[0]].label}</strong></>
                )}
                {selected.length > 1 && (
                  <>Mixing <strong>{selected.map((id) => CATEGORY_MAP[id].label).join(' + ')}</strong></>
                )}
              </span>
            </div>
          </div>

          <div className="results-row">
            <div className="card result-card">
              <div className="card-label">
                <span className="title">Default Result</span>
                <span className="result-badge default">Base model</span>
              </div>
              <pre className={`result-body ${!defaultResult ? 'empty' : ''}`}>
                {defaultResult || 'Results will appear here after you press Calculate.'}
              </pre>
            </div>

            <div
              className="card result-card rag"
              style={{ '--mix-color': mixColor }}
            >
              <div className="card-label">
                <span className="title">RAG LLM Result</span>
                <span className="result-badge rag">RAG-enhanced</span>
              </div>
              <pre className={`result-body ${!ragResult ? 'empty' : ''}`}>
                {ragResult || 'Results will appear here after you press Calculate.'}
              </pre>
            </div>
          </div>
        </div>

        <div className="column">
          <div className="model-status">
            <span className={`status-light ${modelName === 'checking' ? '' : modelName ? 'linked' : 'not-linked'}`} />
            <span><strong>Model:</strong> {modelLabel}</span>
          </div>

          <div className="card prompt-card">
            <div className="card-label">
              <span className="title">Your Problem</span>
            </div>
            <textarea
              className="prompt-textarea"
              placeholder="Enter your math problem here…"
              value={prompt}
              onChange={(e) => setPrompt(e.target.value)}
            />
            <button type="button" className="calculate-btn" onClick={handleCalculate} disabled={loading}>
              {loading ? 'Calculating…' : 'Calculate'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
